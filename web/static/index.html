<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>netnoodle</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top" hidden id="top">
    <span class="brand">netnoodle</span>
    <nav id="nav">
      <a href="#/" data-view="overview">Overview</a>
      <a href="#/events" data-view="events">Events</a>
    </nav>
    <span class="spacer"></span>
    <span id="who" class="muted"></span>
    <button id="logout" class="link">Log out</button>
  </header>

  <main id="main">
    <section id="login" class="card narrow" hidden>
      <h1>netnoodle</h1>
      <form id="login-form">
        <label>User <input name="user" autocomplete="username" required value="admin"></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Log in</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>
    <section id="view"></section>
  </main>
</body>
</html>
