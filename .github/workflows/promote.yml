# Promote a release to the "stable" channel (docs/design/lifecycle.md section 2a, D-067).
# The image tag "stable" gets the SAME digest as the release (no new build), the digest
# gets a keyless signature of this workflow with the annotation channel=stable (the host
# updater requires it on stable), and only then the git branch "stable" is
# fast-forwarded to the release tag.
# The job runs in the environment "stable-promotion": add required reviewers to it in
# the repository settings (Settings > Environments) so that one write-access account
# cannot promote alone.
name: promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to promote, e.g. v1.4.2"
        required: true
      skip_wait:
        description: "Promote before the 7-day waiting time (security fixes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: stable-promotion
    permissions:
      contents: write
      packages: write
      id-token: write # keyless signature channel=stable
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: validate input
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must be vX.Y.Z (no pre-release)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: check release and waiting time
        run: |
          set -eu
          info=$(gh release view "$VERSION" --json isPrerelease,isDraft,publishedAt)
          [ "$(echo "$info" | jq -r .isPrerelease)" = false ] || { echo "pre-releases cannot be promoted"; exit 1; }
          [ "$(echo "$info" | jq -r .isDraft)" = false ] || { echo "draft releases cannot be promoted"; exit 1; }
          published=$(date -d "$(echo "$info" | jq -r .publishedAt)" +%s)
          age_days=$(( ( $(date +%s) - published ) / 86400 ))
          echo "release age: $age_days days"
          if [ "$age_days" -lt 7 ] && [ "${{ inputs.skip_wait }}" != true ]; then
            echo "release is younger than 7 days; set skip_wait for a security fix"; exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: check the stable branch first (no downgrade)
        run: |
          set -eu
          commit=$(git rev-parse "$VERSION^{commit}")
          if git ls-remote --exit-code --heads origin stable >/dev/null; then
            git fetch origin stable
            git merge-base --is-ancestor origin/stable "$commit" || { echo "stable is not an ancestor of $VERSION (no downgrades)"; exit 1; }
          fi
      - name: re-tag images (same digest), check, sign channel=stable
        run: |
          set -eu
          owner=${GITHUB_REPOSITORY_OWNER,,}
          for t in server scan actor; do
            img="ghcr.io/$owner/netnoodle-$t"
            want=$(docker buildx imagetools inspect "$img:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "$want" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "no digest for $img:$VERSION"; exit 1; }
            cosign verify --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/${VERSION}$" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$img@$want" >/dev/null
            cosign sign --yes -a channel=stable "$img@$want"
            docker buildx imagetools create --tag "$img:stable" "$img@$want"
            got=$(docker buildx imagetools inspect "$img:stable" --format '{{json .Manifest.Digest}}' | tr -d '"')
            [ "$got" = "$want" ] || { echo "$img:stable is $got, expected $want"; exit 1; }
          done
      - name: fast-forward branch stable (last step, the binary updater follows it)
        run: |
          set -eu
          commit=$(git rev-parse "$VERSION^{commit}")
          if git ls-remote --exit-code --heads origin stable >/dev/null; then
            git fetch origin stable
            git merge-base --is-ancestor origin/stable "$commit" || { echo "stable is not an ancestor of $VERSION (no downgrades)"; exit 1; }
          fi
          git push origin "$commit:refs/heads/stable"
      - name: mark the release
        run: |
          body=$(gh release view "$VERSION" --json body -q .body)
          printf '%s\n\n---\nPromoted to **stable** on %s.\n' "$body" "$(date -u +%Y-%m-%d)" > notes.md
          gh release edit "$VERSION" --notes-file notes.md
