# Release: runs on a version tag (vX.Y.Z, also vX.Y.Z-rc.1 for pre-releases).
# Builds all binaries (docs/design/lifecycle.md section 5a), multi-arch images on GHCR,
# SBOMs, Sigstore (keyless) signatures, and the GitHub release. Images get the tags
# vX.Y.Z, vX.Y and latest; "stable" is set only by the promote workflow.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

env:
  GO_VERSION_PKG: github.com/JulianStremel/netnoodle/internal/version

jobs:
  # A tag alone must not publish signed code (security review 2026-11-20):
  # the tag commit must be on the protected main branch, and the full CI must
  # pass on it, before anything is built or signed. The environment "release"
  # can require a reviewer (Settings > Environments).
  gate:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: tag commit is on main
        run: |
          set -eu
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME points to a commit that is not on main"; exit 1; }

  ci:
    needs: gate
    uses: ./.github/workflows/ci.yml

  go-binaries:
    needs: [gate, ci]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" } # Raspberry Pi 2 and 32-bit Pi OS
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          arch=$GOARCH; [ "$GOARCH" = arm ] && arch=armv7
          out="dist/netnoodle_${TAG}_${GOOS}_${arch}"
          mkdir -p "$out"
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          progs="nn-scan nn-actor"
          if [ "$GOOS" = linux ]; then
            progs="$progs nn-server"
            [ -d cmd/nn-host-updater ] && progs="$progs nn-host-updater"
          fi
          for p in $progs; do
            go build -trimpath -ldflags "-s -w -X ${GO_VERSION_PKG}.Version=${TAG}" -o "$out/$p$ext" "./cmd/$p"
          done
          cp README.md "$out/"
          [ "$GOOS" = linux ] && cp -r deploy "$out/"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$(basename "$out").zip" "$(basename "$out")"; else tar -czf "$(basename "$out").tar.gz" "$(basename "$out")"; fi
          rm -rf "$(basename "$out")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*
          retention-days: 3

  # Static musl binaries, built natively on each architecture (GitHub's arm64
  # runner for aarch64): no cross linker. The zig route failed on aarch64
  # (current Rust passes --fix-cortex-a53-843419, which zig's linker refuses)
  # and needed an unpinned pip package.
  agent-linux:
    needs: [gate, ci]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          # No armv7 runner: Ubuntu's ARM cross gcc compiles ring and links;
          # Rust ships the musl libc for the target.
          - { target: armv7-unknown-linux-musleabihf, runner: ubuntu-24.04, cross: arm-linux-gnueabihf }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools ${{ matrix.cross && format('gcc-{0}', matrix.cross) || '' }}
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: build
        working-directory: agent
        env:
          NN_VERSION: ${{ github.ref_name }}
        run: |
          target=${{ matrix.target }}
          cross=${{ matrix.cross }}
          if [ -n "$cross" ]; then
            export "CC_${target//-/_}=$cross-gcc"
            linker="CARGO_TARGET_$(echo "${target//-/_}" | tr a-z A-Z)_LINKER"
            export "$linker=$cross-gcc"
          else
            export "CC_${target//-/_}=musl-gcc"
          fi
          cargo build --locked --release --target "$target" -p nn-agent
          file "target/$target/release/nn-agent" "target/$target/release/nn-agent-helper"
      - name: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          arch=${{ matrix.target }}; arch=${arch%%-*}
          out="dist/nn-agent_${TAG}_linux_${arch}"
          mkdir -p "$out"
          cp agent/target/${{ matrix.target }}/release/nn-agent agent/target/${{ matrix.target }}/release/nn-agent-helper "$out/"
          cp deploy/nn-agent*.service deploy/nn-agent*.socket deploy/nn-agent.example.json "$out/" 2>/dev/null || true
          tar -C dist -czf "$out.tar.gz" "$(basename "$out")" && rm -rf "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-linux-${{ matrix.target }}
          path: dist/*
          retention-days: 3

  agent-windows:
    needs: [gate, ci]
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
          # ring compiles C code; for ARM64 it needs clang (LLVM is on the runner image).
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: build
        working-directory: agent
        env:
          NN_VERSION: ${{ github.ref_name }}
        run: cargo build --locked --release --target ${{ matrix.target }} -p nn-agent --bin nn-agent
      - name: package
        shell: pwsh
        run: |
          $arch = if ("${{ matrix.target }}".StartsWith("aarch64")) { "arm64" } else { "amd64" }
          $out = "dist/nn-agent_${{ github.ref_name }}_windows_$arch"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "agent/target/${{ matrix.target }}/release/nn-agent.exe" $out
          Copy-Item README.md $out
          Compress-Archive -Path $out -DestinationPath "$out.zip"
          Remove-Item -Recurse $out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-windows-${{ matrix.target }}
          path: dist/*
          retention-days: 3

  images:
    needs: [gate, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
    strategy:
      matrix:
        target: [server, scan, actor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/netnoodle-${{ matrix.target }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # The "v" must be a prefix: in the pattern, metadata-action drops it
            # (v0.1.0-rc.2 was pushed as 0.1.0-rc.2; promote.yml needs vX.Y.Z).
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NN_VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  release:
    runs-on: ubuntu-latest
    needs: [go-binaries, agent-linux, agent-windows, images]
    permissions:
      contents: write
      id-token: write # keyless signing of the checksums
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: only release files (no docker build records)
        run: find dist -maxdepth 1 -type f -name '*.dockerbuild' -delete
      - name: source SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: dist/netnoodle_${{ github.ref_name }}_source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: checksums and signature
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          flags="--generate-notes --verify-tag"
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" dist/* $flags --title "netnoodle $TAG"
