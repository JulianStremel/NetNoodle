[workspace]
resolver = "2"
members = ["nn-proto", "nn-agent", "nn-actor-host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
